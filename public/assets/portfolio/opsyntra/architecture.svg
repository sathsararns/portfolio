<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1970" viewBox="0 0 1600 1970" role="img" aria-labelledby="title desc">
<title id="title">Opsyntra system architecture</title>
<desc id="desc">Validated Telco data feeds scikit-learn and optional Spark training. Saved pipelines serve direct Next.js and FastAPI predictions and a separate Kafka inference consumer. MLflow tracks experiments and optional Airflow DAGs orchestrate tasks. The Kafka consumer uses a persistent SQLite outbox, emits predictions and dead letters, and a separate analytics consumer persists all three topics into PostgreSQL before committing Kafka offsets. Read-only FastAPI endpoints feed polling-based Next.js Live monitoring.</desc>
