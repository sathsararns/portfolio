<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">WedaHub system architecture</title>
  <desc id="desc">React and Vite send REST and chat requests to Express. Express sends Socket.IO events to the frontend, stores data in MongoDB through Mongoose, and forwards chat, reset and readiness operations to FastAPI and LangGraph. The AI service calls Express for provider search, booking creation and booking status, and calls a Groq-hosted language model. The frontend connects to Cloudinary, Geoapify and OpenStreetMap.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#020617"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 310H470"/>
    <path d="M470 365H270"/>
    <path d="M590 280V170"/>
    <path d="M710 310H930"/>
    <path d="M930 365H710"/>
    <path d="M1045 390V580"/>
    <path d="M155 390V580"/>
  </g>
  <g font-family="'Courier New',monospace" font-size="14" fill="#cbd5e1">
    <text x="370" y="294" text-anchor="middle">REST + chat requests</text>
    <text x="370" y="398" text-anchor="middle">Socket.IO events</text>
    <text x="606" y="226">Application data</text>
    <text x="820" y="290" text-anchor="middle">Chat, reset, readiness</text>
    <text x="820" y="400" text-anchor="middle"><tspan x="820">Provider search,</tspan><tspan x="820" dy="21">booking creation + status</tspan></text>
    <text x="1062" y="478"><tspan x="1062">Model</tspan><tspan x="1062" dy="21">inference</tspan></text>
    <text x="175" y="478"><tspan x="175">Uploads, locations,</tspan><tspan x="175" dy="21">and map tiles</tspan></text>
  </g>
  <g fill="#0f172a" stroke="#475569" stroke-width="1.5">
    <rect x="40" y="280" width="230" height="110" rx="16"/>
    <rect x="470" y="280" width="240" height="110" rx="16"/>
    <rect x="470" y="70" width="240" height="100" rx="16"/>
    <rect x="40" y="580" width="300" height="110" rx="16"/>
    <rect x="930" y="580" width="230" height="110" rx="16"/>
    <rect x="930" y="280" width="230" height="110" rx="16" fill="#082f49" stroke="#38bdf8"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle">
    <g fill="#f1f5f9" font-size="19" font-weight="700">
      <text x="155" y="320">React / Vite</text>
      <text x="590" y="320">Express backend</text>
      <text x="590" y="112">MongoDB</text>
      <text x="1045" y="320">FastAPI / LangGraph</text>
      <text x="1045" y="623">Groq-hosted</text>
      <text x="190" y="623">Cloudinary</text>
    </g>
    <g fill="#cbd5e1" font-size="16">
      <text x="155" y="351">Frontend</text>
      <text x="590" y="351">REST APIs + Socket.IO</text>
      <text x="590" y="140">via Mongoose</text>
      <text x="1045" y="351">AI workflow</text>
      <text x="1045" y="653">Language model</text>
      <text x="190" y="653">Geoapify / OpenStreetMap</text>
    </g>
  </g>
</svg>
