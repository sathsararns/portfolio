<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050" role="img" aria-labelledby="title desc">
<title id="title">Voya AI system architecture</title>
<desc id="desc">The React browser app uses Nginx and FastAPI. Authentication and conversation ownership connect to PostgreSQL and Redis. Deterministic routing selects history, shared Pinecone knowledge, account-scoped memory and local budget or seasonal climate functions. Prompt construction leads to structured Groq generation and validation, with clarification and unsupported-information fallbacks and correction requests. Persistence stores successful exchanges and eligible learning before SSE and frontend progressive reveal. A manual ingestion CLI extracts PDF text, reviewed sidecars or local OCR and sends chunked text to Pinecone integrated embeddings.</desc>
